<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="assets/logo.png" alt="Arcade" class="header-logo">
            <div class="auth-area" id="authArea"></div>
        </div>
    </header>

    <main class="main">
        <div class="active-users-bar" id="activeUsersBar">
            <span class="active-users-dot"></span>
            <span id="activeUsersText">0 active users</span>
        </div>

        <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="games">Games</button>
            <button class="tab-btn" data-tab="users">Users</button>
            <button class="tab-btn" data-tab="gallery">Gallery</button>
            <button class="tab-btn" data-tab="chat">Chat</button>
        </div>

        <div id="gamesView">
            <div class="controls">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search" class="search-input" placeholder="Search games...">
                </div>
                <div class="controls-row">
                    <div class="categories" id="categories">
                        <button class="cat-btn active" data-category="all">All</button>
                    </div>
                    <span class="game-count" id="gameCount"></span>
                </div>
            </div>

            <div class="game-grid" id="gameGrid"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No games found.</p>
            </div>
        </div>

        <div id="usersView" style="display:none;"></div>
        <div id="galleryView" style="display:none;"></div>
        <div id="chatView" style="display:none;"></div>
        <div id="banView" style="display:none;"></div>
    </main>


    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/users.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/emojis.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/tabs.js"></script>
</body>
</html>
