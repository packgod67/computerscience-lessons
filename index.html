<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="icon" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="assets/logo.png" alt="Arcade" class="header-logo">
            <div class="auth-area" id="authArea"></div>
        </div>
    </header>

    <main class="main">
        <div class="active-users-bar" id="activeUsersBar">
            <span class="active-users-dot"></span>
            <span id="activeUsersText">0 active users</span>
        </div>

        <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="games">Games</button>
            <button class="tab-btn" data-tab="users">Users</button>
            <button class="tab-btn" data-tab="gallery">Gallery</button>
            <button class="tab-btn" data-tab="chat">Chat</button>
            <button class="tab-btn" data-tab="messages">Messages</button>
            <button class="tab-btn" data-tab="saves">Saves</button>
            <button class="tab-btn" data-tab="requests">Requests</button>
        </div>

        <div id="gamesView">
            <div class="controls">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search" class="search-input" placeholder="Search games or #tag (combine: #rpg #roguelite)">
                    <button id="randomGameBtn" class="random-btn" title="Random game" aria-label="Random game">&#127922;</button>
                </div>
                <!-- Active tag-filter pills, populated by app.js when the
                     search box has #tag queries. Each pill has a × to
                     remove just that one tag. Hidden when no tags active. -->
                <div class="active-tag-pills" id="activeTagPills" hidden></div>
                <div class="controls-row">
                    <!-- Mobile dropdown — only visible on small screens. Shows
                         the active category and opens a full category picker
                         when tapped. The horizontal strip below (.categories)
                         is hidden on mobile via CSS. -->
                    <button id="catDropdownBtn" class="cat-dropdown-btn" type="button" aria-expanded="false">
                        <span class="cat-dropdown-label" id="catDropdownLabel">All</span>
                        <svg class="cat-dropdown-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div id="catDropdownPanel" class="cat-dropdown-panel" hidden></div>

                    <div class="categories" id="categories">
                        <button class="cat-btn active" data-category="all">All</button>
                    </div>
                    <span class="game-count" id="gameCount"></span>
                </div>
            </div>

            <!-- Continue Playing strip — populated by app.js when the user is
                 logged in and has recentPlays. Hidden otherwise. -->
            <section class="continue-playing" id="continuePlaying" hidden>
                <div class="continue-header">
                    <h2 class="section-title">&#9654; Continue Playing</h2>
                    <button class="continue-clear" id="continueClearBtn" title="Clear history">Clear</button>
                </div>
                <div class="continue-strip" id="continueStrip"></div>
            </section>

            <div class="game-grid" id="gameGrid"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No games found.</p>
            </div>
        </div>

        <div id="usersView" style="display:none;"></div>
        <div id="galleryView" style="display:none;"></div>
        <div id="chatView" style="display:none;"></div>
        <div id="messagesView" style="display:none;"></div>
        <div id="savesView" style="display:none;"></div>
        <div id="requestsView" style="display:none;"></div>
        <div id="banView" style="display:none;"></div>
        <div id="cheatsView" style="display:none;"></div>
    </main>


    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/recommender.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/app.js"></script>
    <script src="js/users.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/emojis.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/cheats.js"></script>
    <script src="js/patchnotes.js"></script>
    <script src="js/saves.js"></script>
    <script src="js/requests.js"></script>
    <script src="js/ps2-preload.js"></script>
    <script src="js/tabs.js"></script>
</body>
</html>
