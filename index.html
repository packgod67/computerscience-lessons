<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover honors iPhone safe areas (notch + home
         indicator). Combined with env(safe-area-inset-*) in CSS,
         the arcade extends edge-to-edge in standalone mode without
         hiding content under hardware. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Arcade</title>
    <meta name="description" content="A massive arcade of browser games — Pokemon, retro ROMs, modern itch picks, Newgrounds Flash. Cloud saves, multiplayer, offline mode.">

    <!-- Theme + status bar color. Updates the Android Chrome address
         bar and the iOS standalone-mode status bar background. -->
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arcade">
    <meta name="application-name" content="Arcade">
    <meta name="format-detection" content="telephone=no">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
    <link rel="shortcut icon" href="assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Resource hints — open connections to the hosts the arcade uses
         most so the actual fetches start sooner. preconnect opens a
         TCP+TLS handshake immediately; dns-prefetch only resolves DNS
         (cheaper, fallback for older browsers). -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://html-classic.itch.zone">
    <link rel="dns-prefetch" href="https://arcad-groq.gatabanumai.workers.dev">

    <!-- Preload the catalog — biggest single asset on first paint, gets
         requested by app.js right after script eval. Telling the browser
         early shaves ~100-300ms off Time-to-Interactive. -->
    <link rel="preload" href="games/games.json" as="fetch" crossorigin>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="assets/logo.png" alt="Arcade" class="header-logo">
            <button class="arcade-settings-gear" id="arcadeSettingsGear" type="button" title="Settings" aria-label="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <div class="auth-area" id="authArea"></div>
        </div>
    </header>

    <main class="main">
        <div class="active-users-bar" id="activeUsersBar">
            <span class="active-users-dot"></span>
            <span id="activeUsersText">0 active users</span>
        </div>

        <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="games">Games</button>
            <button class="tab-btn" data-tab="users">Users</button>
            <button class="tab-btn" data-tab="gallery">Gallery</button>
            <button class="tab-btn" data-tab="chat">Chat</button>
            <button class="tab-btn" data-tab="messages">Messages</button>
            <button class="tab-btn" data-tab="friends">Friends</button>
            <button class="tab-btn" data-tab="saves">Saves</button>
            <button class="tab-btn" data-tab="requests">Requests</button>
        </div>

        <div id="gamesView">
            <div class="controls">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search" class="search-input" placeholder="Search games or #tag (combine: #rpg #roguelite)">
                    <button id="randomGameBtn" class="random-btn" title="Random game" aria-label="Random game">&#127922;</button>
                </div>
                <!-- Active tag-filter pills, populated by app.js when the
                     search box has #tag queries. Each pill has a × to
                     remove just that one tag. Hidden when no tags active. -->
                <div class="active-tag-pills" id="activeTagPills" hidden></div>
                <div class="controls-row">
                    <!-- Mobile dropdown — only visible on small screens. Shows
                         the active category and opens a full category picker
                         when tapped. The horizontal strip below (.categories)
                         is hidden on mobile via CSS. -->
                    <button id="catDropdownBtn" class="cat-dropdown-btn" type="button" aria-expanded="false">
                        <span class="cat-dropdown-label" id="catDropdownLabel">All</span>
                        <svg class="cat-dropdown-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div id="catDropdownPanel" class="cat-dropdown-panel" hidden></div>

                    <div class="categories" id="categories">
                        <button class="cat-btn active" data-category="all">All</button>
                    </div>
                    <span class="game-count" id="gameCount"></span>
                </div>
            </div>

            <!-- Continue Playing strip — populated by app.js when the user is
                 logged in and has recentPlays. Hidden otherwise. -->
            <section class="continue-playing" id="continuePlaying" hidden>
                <div class="continue-header">
                    <h2 class="section-title">&#9654; Continue Playing</h2>
                    <button class="continue-clear" id="continueClearBtn" title="Clear history">Clear</button>
                </div>
                <div class="continue-strip" id="continueStrip"></div>
            </section>

            <div class="game-grid" id="gameGrid"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No games found.</p>
            </div>
        </div>

        <div id="usersView" style="display:none;"></div>
        <div id="galleryView" style="display:none;"></div>
        <div id="chatView" style="display:none;"></div>
        <div id="messagesView" style="display:none;"></div>
        <div id="friendsView" style="display:none;"></div>
        <div id="savesView" style="display:none;"></div>
        <div id="requestsView" style="display:none;"></div>
        <div id="banView" style="display:none;"></div>
        <div id="cheatsView" style="display:none;"></div>
    </main>


    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/profile-widgets.js"></script>
    <script src="js/recommender.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/admintags.js"></script>
    <script src="js/lazyload.js"></script>
    <script src="js/offlinepack.js"></script>
    <script src="js/coop.js"></script>
    <script src="js/install.js"></script>
    <script src="js/friends.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>

    <!-- MOBILE-ONLY lazy-load for admin tooling. Bulk-add + catalog
         admin are only useful to admins (~5% of mobile users); loading
         them eagerly burns parse time most users don't benefit from.
         Desktop keeps eager loading for snappy click→modal UX. -->
    <script>
    (function () {
        var isMobile = window.matchMedia('(max-width: 768px)').matches;
        var adminOnly = ['js/bulkadd.js', 'js/catalogadmin.js'];
        if (!isMobile) {
            for (var i = 0; i < adminOnly.length; i++) {
                var s = document.createElement('script');
                s.src = adminOnly[i];
                s.async = false;
                document.head.appendChild(s);
            }
        }
        // Mobile: app.js admin button handlers call
        // window.ArcadeLazyLoad.loadScript('js/bulkadd.js') on click.
    })();
    </script>
    <script src="js/users.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/emojis.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/cheats.js"></script>
    <script src="js/patchnotes.js"></script>
    <script src="js/saves.js"></script>
    <script src="js/requests.js"></script>
    <script src="js/ps2-preload.js"></script>
    <script src="js/tabs.js"></script>
    <script>
    // Wire the header gear → settings modal once both DOM and
    // settings.js are ready. Idempotent.
    (function () {
        var btn = document.getElementById('arcadeSettingsGear');
        if (btn) btn.addEventListener('click', function () {
            window.ArcadeSettings && window.ArcadeSettings.openSettingsModal();
        });
    })();
    </script>
</body>
</html>
