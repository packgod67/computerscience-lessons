<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gun Knight</title>
<script>
// itch.io blocks external iframes via CSP frame-ancestors. Navigate the
// top frame straight to the itch.io page where the game is playable.
// User plays on itch and uses browser-back to return.
(function () {
    const target = 'https://stepford.itch.io/gun-knight';
    try {
        if (window.top && window.top !== window.self) {
            window.top.location.replace(target);
            return;
        }
    } catch (e) { /* same-origin, ignore */ }
    window.location.replace(target);
})();
</script>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0a0f; color:#e5e5e5; font-family:Arial,sans-serif; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div style="text-align:center;padding:20px;">
  <p>Opening Gun Knight on itch.io…</p>
  <p style="opacity:.6;font-size:0.85rem;">
    If this doesn't redirect, <a href="https://stepford.itch.io/gun-knight" target="_top" style="color:#a5b4fc;">click here</a>.
  </p>
</div>
</body>
</html>
