<!DOCTYPE html>


<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


  <head>
    <script src="../js/ds-mode.js"></script>
    <!-- 7z-wasm for client-side .7z extraction. EmulatorJS can't auto-detect
         7z on blob URLs, so we unpack the archive ourselves and hand the raw
         .nds ROM to the emulator. -->
    <script src="https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.umd.js"></script>
    <script>
      window.gameconfig = {
        name: "Pokemon Volt White 2 Redux Complete (v1.4.1)",
        url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@c1286889f729281cf543c86ce59732b638cdaa86/volt%20white%20redux/Pokemon%20Volt%20White%202%20Redux%20Complete%20(v1.4.1).7z",
        core: "desmume2015",
        min: 1,
        max: 4,
      };
    </script>
    <script>
      function mergeParts(fileParts, onProgress) {
        return new Promise((resolve, reject) => {
          const buffers = [];
          function fetchPart(index) {
            if (index >= fileParts.length) {
              resolve(new Blob(buffers, { type: 'application/x-7z-compressed' }));
              return;
            }
            fetch(fileParts[index])
              .then(r => r.arrayBuffer())
              .then(data => {
                buffers.push(data);
                onProgress('parts', index + 1, fileParts.length);
                fetchPart(index + 1);
              })
              .catch(reject);
          }
          fetchPart(0);
        });
      }

      function getParts(file, start, end) {
        const parts = [];
        for (let i = start; i <= end; i++) {
          const padded = String(i).padStart((end + '').length, '0');
          parts.push(file + '.part' + padded);
        }
        return parts;
      }

      async function extractNdsFrom7z(archiveBlob, onProgress) {
        onProgress('extract', 0, 1);
        const bytes = new Uint8Array(await archiveBlob.arrayBuffer());
        const SevenZipModule = window.SevenZip || window.sevenzip || window._7z;
        if (!SevenZipModule) {
          throw new Error('7z-wasm library failed to load');
        }
        const sevenZip = await SevenZipModule({
          locateFile: (f) => 'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/' + f,
        });
        sevenZip.FS.writeFile('/rom.7z', bytes);
        sevenZip.FS.mkdir('/out');
        try {
          sevenZip.callMain(['x', '-y', '-o/out', '/rom.7z']);
        } catch (err) {
          console.error('7z extraction error:', err);
        }
        onProgress('extract', 1, 1);
        const findNds = (dir) => {
          const entries = sevenZip.FS.readdir(dir);
          for (const entry of entries) {
            if (entry === '.' || entry === '..') continue;
            const path = dir === '/' ? '/' + entry : dir + '/' + entry;
            const stat = sevenZip.FS.stat(path);
            if (sevenZip.FS.isDir(stat.mode)) {
              const found = findNds(path);
              if (found) return found;
            } else if (/\.nds$/i.test(entry)) {
              return path;
            }
          }
          return null;
        };
        const ndsPath = findNds('/out');
        if (!ndsPath) throw new Error('No .nds file found inside archive');
        const ndsData = sevenZip.FS.readFile(ndsPath);
        return new Blob([ndsData], { type: 'application/octet-stream' });
      }
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 16px;
        margin-top: 20px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        display: inline-block;
      }
      #first-time {
        font-size: 13px;
        color: #888;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Downloading…</div>
      <div id="first-time">First-time loading may take a minute (large archive)</div>
    </div>
    <script>
      (async () => {
        const progressEl = document.getElementById('loading-progress');
        const firstTimeEl = document.getElementById('first-time');
        function setProgress(phase, loaded, total) {
          if (phase === 'parts') {
            progressEl.textContent = `Downloading parts: ${loaded}/${total}`;
          } else if (phase === 'extract') {
            progressEl.textContent = loaded === 0
              ? 'Extracting archive…'
              : 'Archive extracted, starting emulator…';
          }
        }

        try {
          const parts = getParts(
            window.gameconfig.url,
            window.gameconfig.min,
            window.gameconfig.max
          );
          const sevenZipBlob = await mergeParts(parts, setProgress);
          const ndsBlob = await extractNdsFrom7z(sevenZipBlob, setProgress);
          const ndsUrl = URL.createObjectURL(ndsBlob);

          progressEl.remove();
          firstTimeEl.remove();

          EJS_player = '#game';
          EJS_core = window.gameconfig.core;
          EJS_gameName = window.gameconfig.name;
          EJS_color = '#0064ff';
          EJS_startOnLoaded = true;
          EJS_threads = true;
          if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
          EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/';
          EJS_gameUrl = ndsUrl;

          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js';
          document.body.appendChild(script);
        } catch (err) {
          console.error('Boot error:', err);
          document.getElementById('loading-progress').textContent =
            'Error loading game: ' + (err && err.message ? err.message : err);
        }
      })();
    </script>
    <script>window.CLOUD_SAVE_GAME_ID = 'clpokevoltwhite2redux';</script>
    <script src="../js/cloud-save.js"></script>
  </body>
</html>
