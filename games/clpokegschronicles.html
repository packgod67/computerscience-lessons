<html>


<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<html>
  <head>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading: 0/0</div>
      <div id="first-time">First-time loading may take longer...</div>
    </div>
    <script>
          document.getElementById("loading-progress").remove();
          document.getElementById("first-time").remove();
          EJS_player = "#game";
          EJS_core = "gba";
          EJS_gameName = "i-forgot";
          EJS_color = "#0064ff";
          EJS_startOnLoaded = true;
          EJS_cacheLimit = 0;
          EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubbls/brogoofyahhmangogotonablacklistskullwiltingrose@main/";
          EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@main/gschronicles%20v2.7.6.zip";
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/gh/bubbls/brogoofyahhmangogotonablacklistskullwiltingrose@main/loader.js";
          document.body.appendChild(script);
    </script>
	<script>
		// Cloud save (robust - polls for emulator)
		(function() {
			var GAME_ID = 'clpokegschronicles';
			var saveStarted = false;

			function saveToCloud() {
				try {
					var state = EJS_emulator.gameManager.getState();
					if (state && state.byteLength > 0) {
						var bytes = new Uint8Array(state);
						var binary = '';
						for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
						window.parent.postMessage({ type: 'save-data', gameId: GAME_ID, data: btoa(binary) }, '*');
					}
				} catch(e) {}
			}

			function startCloudSave() {
				if (saveStarted) return;
				saveStarted = true;
				window.parent.postMessage({ type: 'emu-ready', gameId: GAME_ID }, '*');
				setTimeout(saveToCloud, 10000);
				setInterval(saveToCloud, 60000);
			}

			// Method 1: EJS_onGameStart (newer EmulatorJS)
			EJS_onGameStart = function() { startCloudSave(); };

			// Method 2: Poll for emulator (older EmulatorJS fallback)
			var poll = setInterval(function() {
				try {
					if (typeof EJS_emulator !== 'undefined' && EJS_emulator.gameManager) {
						clearInterval(poll);
						startCloudSave();
					}
				} catch(e) {}
			}, 2000);
			setTimeout(function() { clearInterval(poll); }, 300000);

			// Load save from parent
			window.addEventListener('message', function(e) {
				if (e.data && e.data.type === 'load-save' && e.data.data) {
					try {
						var binary = atob(e.data.data);
						var bytes = new Uint8Array(binary.length);
						for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
						EJS_emulator.gameManager.loadState(bytes.buffer);
					} catch(e) {}
				}
			});

			// Save on tab close
			window.addEventListener('beforeunload', function() { saveToCloud(); });
		})();
	</script>
	<script>window.CLOUD_SAVE_GAME_ID = 'clpokegschronicles';</script>
	<script src="../js/cloud-save.js"></script>
  </body> 
</html>
