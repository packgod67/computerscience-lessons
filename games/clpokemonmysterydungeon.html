<head>
    <script src="coi-serviceworker.js"></script>
	<script src="//www.google.com/jsapi"></script>
	<script>
		window.parent.maeExportApis_();
	</script>

	<style>
		body {
			overflow: hidden;
			background: #000000;
			margin-top: 0;
			margin-left: 0;
			color: #000000;
		}

		#startButton {
			display: block;
			width: 160px;
			height: 40px;
			background-color: #4CAF50;
			color: white;
			text-align: center;
			text-decoration: none;
			font-size: 16px;
			margin: 20px auto;
			padding: 10px 20px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-family: 'Press Start 2P', cursive;
			box-shadow: 0px 0px 10px 2px #000000;
		}
	</style>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
	<style type="text/css">
		#button {
			display: none;
		}

		.imgb_vis {
			animation: imgb-animation 7s linear;
		}

		@keyframes imgb-animation {
			10% {
				transform: translateX(0);
			}

			20% {
				transform: translateX(100px);
			}

			90% {
				transform: translateX(100px);
			}

			100% {
				transform: translateX(0);
			}
		}
	</style>
</head>

<body>
	<div style="width: 100vw; height: 100vh;max-width:100%">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY</button>
	</div>
	<script>
		document.getElementById("game").style.display = "none";
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                EJS_player = "#game";
                EJS_core = "mgba";
                EJS_color = "#000000";
                EJS_startOnLoaded = true;
                EJS_cacheLimit = 0;
                EJS_threads = true;
                EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
                EJS_gameUrl = "https://cdn.jsdelivr.net/gh/mspoi/seraph@00f04730ea81efc0622686e2bab93f0eadf39952/games/pokemonmysterydungeon/pokemonmysterydungeon.zip";
                loadGame();
            }
            document.getElementById("startButton").addEventListener("click", startGame);
            function loadGame() {
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
                document.body.appendChild(script);
            }
	</script>
	<script>
		// Cloud save
		EJS_onGameStart = function() {
			window.parent.postMessage({ type: 'emu-ready', gameId: 'clpokemonmysterydungeon' }, '*');
			setInterval(function() {
				try {
					var state = EJS_emulator.gameManager.getState();
					if (state && state.byteLength > 0) {
						var bytes = new Uint8Array(state);
						var binary = '';
						for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
						window.parent.postMessage({ type: 'save-data', gameId: 'clpokemonmysterydungeon', data: btoa(binary) }, '*');
					}
				} catch(e) { console.error('Auto-save error:', e); }
			}, 60000);
		};
		window.addEventListener('message', function(e) {
			if (e.data && e.data.type === 'load-save' && e.data.data) {
				try {
					var binary = atob(e.data.data);
					var bytes = new Uint8Array(binary.length);
					for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
					EJS_emulator.gameManager.loadState(bytes.buffer);
				} catch(e) { console.error('Cloud load error:', e); }
			}
		});
		window.addEventListener('beforeunload', function() {
			try {
				var state = EJS_emulator.gameManager.getState();
				if (state && state.byteLength > 0) {
					var bytes = new Uint8Array(state);
					var binary = '';
					for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
					window.parent.postMessage({ type: 'save-data', gameId: 'clpokemonmysterydungeon', data: btoa(binary) }, '*');
				}
			} catch(e) {}
		});
	</script>
