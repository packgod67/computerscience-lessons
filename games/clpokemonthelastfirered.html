<!DOCTYPE html>
<html>
<head>

<title>Pokemon The Last Fire Red</title>
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; background:#121212; color:#fff; font-family:Arial,sans-serif; }
  #game-container { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #loading-progress { font-size:16px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px; }
</style>
</head>
<body>
<div id="game-container">
  <div id="game"></div>
  <div id="loading-progress">Loading Pokemon The Last Fire Red...</div>
</div>
<script>
  EJS_player = "#game";
  EJS_core = "gba";
  EJS_gameName = "Pokemon The Last Fire Red";
  EJS_color = "#0064ff";
  EJS_startOnLoaded = true;
  EJS_threads = false;
  EJS_cacheLimit = 0;
  if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
  EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
  EJS_netplayServer = "https://netplay.emulatorjs.org";
  EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@3d64759cb35b901b5f982ce9da2db9053a9948f7/Pokemon%20The%20Last%20Fire%20Red%20(v4.0.3).zip";
  EJS_onGameStart = function() {
    document.getElementById("loading-progress")?.remove();
  };
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
  document.body.appendChild(script);
</script>
<script>window.CLOUD_SAVE_GAME_ID = 'clpokemonthelastfirered';</script>
