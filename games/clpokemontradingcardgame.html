<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokemon Trading Card Game</title>

<style>
  body, html { margin:0; padding:0; width:100%; height:100%; background:#121212; color:#fff; font-family:Arial,sans-serif; }
  #game-container { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #loading-progress { font-size:16px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px; }
</style>
</head>
<body>
<div id="game-container">
  <div id="game"></div>
  <div id="loading-progress">Loading Pokemon Trading Card Game...</div>
</div>
<script>
  EJS_player = "#game";
  EJS_core = "gambatte";
  EJS_gameName = "Pokemon Trading Card Game";
  EJS_color = "#0064ff";
  EJS_startOnLoaded = true;
  EJS_threads = false;
  EJS_cacheLimit = 0;
  if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
  EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
  EJS_netplayServer = "https://netplay.emulatorjs.org";
  EJS_gameUrl = "https://arcad-groq.gatabanumai.workers.dev/rom?src=https%3A%2F%2Farchive.org%2Fdownload%2Fpokgbcroms%2FPokemon%2520Trading%2520Card%2520Game%2520%2528Europe%2529%2520%2528En%252CEs%252CIt%2529%2520%2528SGB%2520Enhanced%2529%2520%2528GB%2520Compatible%2529.zip";
  EJS_onGameStart = function() { document.getElementById("loading-progress")?.remove(); };
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
  document.body.appendChild(script);
</script>
</body>
</html>
