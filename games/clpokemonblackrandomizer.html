<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pokemon Black Randomizer</title>
<script src="../js/ds-mode.js"></script>
<style>
  body, html { margin:0; padding:0; width:100%; height:100%; background:#121212; color:#fff; font-family:Arial,sans-serif; }
  #game-container { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  #loading-progress { font-size:16px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px; }
</style></head>
<body>
<div id="game-container"><div id="game"></div><div id="loading-progress">Loading Pokemon Black Randomizer...</div></div>
<script>
  EJS_player = "#game";
  EJS_core = "desmume2015";
  EJS_gameName = "Pokemon Black Randomizer";
  EJS_color = "#0064ff";
  EJS_startOnLoaded = true;
  EJS_threads = false;
  EJS_cacheLimit = 0;
  if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
  EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
  EJS_netplayServer = "https://netplay.emulatorjs.org";
  EJS_gameUrl = "https://arcad-groq.gatabanumai.workers.dev/rom?src=https%3A%2F%2Farchive.org%2Fdownload%2Fpkm_2%2FPokemon%2520Black%25202%2520Extreme%2520Randomized%2520%2520%2528Pokemonrom.net%2529.zip";
  EJS_onGameStart = function() { document.getElementById("loading-progress")?.remove(); };
  var script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
  document.body.appendChild(script);
</script>
</body></html>
