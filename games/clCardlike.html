<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cardlike</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Cardlike — free HTML5 deck-builder by electronicsunrise (itch.io).
     Embeds the dev's own custom domain directly. cardlike.io has no
     X-Frame-Options or CSP frame-ancestors, so no proxy/itch shim needed.
     The itch embed at html/17356523 just iframes cardlike.io anyway,
     so going direct skips the htmlgame.js hotlink-redirect dance. -->
<iframe src="https://cardlike.io" allow="autoplay; fullscreen; gamepad *; gyroscope; accelerometer" allowfullscreen></iframe>
</body>
</html>
