<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PokeRogue</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0a0f; }
  iframe { display:block; width:100%; height:100vh; border:0; }
</style>
</head>
<body>
<!-- PokeRogue is hosted at pokerogue.net and confirmed iframable
     (no X-Frame-Options, no CSP frame-ancestors). Just embed and let
     it run. -->
<iframe src="https://pokerogue.net/"
        allow="autoplay; gamepad *; fullscreen"
        allowfullscreen></iframe>
</body>
</html>
