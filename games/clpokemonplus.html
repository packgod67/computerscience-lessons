<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokemon Plus</title>
<script>
window.gameconfig = {
  name: "Pokemon Plus",
  url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@b4ad0afb174a2c482c3d6c13b748095704e17b4d/pokemon%20plus/Pokemon%20-%20Ruby%20Version%20%28USA%2C%20Europe%29%20%28patched%29.gba",
  core: "gba",
  min: 1,
  max: 2,
};
function mergeFiles(fileParts, cb) {
  return new Promise((resolve, reject) => {
    let buffers = [];
    function fetchPart(index) {
      if (index >= fileParts.length) {
        resolve(URL.createObjectURL(new Blob(buffers)));
        return;
      }
      fetch(fileParts[index]).then(r => r.arrayBuffer()).then(d => {
        buffers.push(d);
        fetchPart(index + 1);
      }).catch(reject);
      cb(index);
    }
    fetchPart(0);
  });
}
function getParts(file, start, end) {
  let parts = [];
  for (let i = start; i <= end; i++) parts.push(file + '.part' + i);
  return parts;
}
</script>
<style>
body, html { margin:0; padding:0; width:100%; height:100%; background:#121212; color:#fff; font-family:Arial,sans-serif; }
#game-container { width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
#loading-progress { font-size:16px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px; }
</style>
</head>
<body>
<div id="game-container">
  <div id="game"></div>
  <div id="loading-progress">Loading: 0/0</div>
</div>
<script>
var parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
var totalParts = parts.length;
function updateLoadingProgress(loaded) {
  document.getElementById('loading-progress').textContent = 'Loading: ' + (loaded || 0) + '/' + totalParts;
}
mergeFiles(parts, updateLoadingProgress).then(gameUrl => {
  document.getElementById('loading-progress')?.remove();
  EJS_player = '#game';
  EJS_core = window.gameconfig.core;
  EJS_gameName = window.gameconfig.name;
  EJS_color = '#0064ff';
  EJS_startOnLoaded = true;
  EJS_threads = false;
  if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
  EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/';
  EJS_netplayServer = 'https://netplay.emulatorjs.org';
  EJS_gameUrl = gameUrl;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js';
  document.body.appendChild(s);
});
</script>
</body>
</html>
