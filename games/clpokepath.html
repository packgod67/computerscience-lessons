<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<!DOCTYPE html>
<html>
<head>
<base href="https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/MISC/pokepath/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PokéPath TD</title>
    <link rel="icon" type="image/x-icon" href="./src/assets/icon.ico">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./src/css/ui.css">
    <link rel="stylesheet" href="./src/css/scenes.css">
</head>
<body>
    <div id="view-port">
        <div id="screen-root">
            <div id="screen"></div>
        </div>
    </div>
    <script type="module" src="./src/js/bootstrap.js"></script>
	<script>
		// Cloud save
		EJS_onGameStart = function() {
			window.parent.postMessage({ type: 'emu-ready', gameId: 'clpokepath' }, '*');
			setInterval(function() {
				try {
					var state = EJS_emulator.gameManager.getState();
					if (state && state.byteLength > 0) {
						var bytes = new Uint8Array(state);
						var binary = '';
						for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
						window.parent.postMessage({ type: 'save-data', gameId: 'clpokepath', data: btoa(binary) }, '*');
					}
				} catch(e) { console.error('Auto-save error:', e); }
			}, 60000);
		};
		window.addEventListener('message', function(e) {
			if (e.data && e.data.type === 'load-save' && e.data.data) {
				try {
					var binary = atob(e.data.data);
					var bytes = new Uint8Array(binary.length);
					for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
					EJS_emulator.gameManager.loadState(bytes.buffer);
				} catch(e) { console.error('Cloud load error:', e); }
			}
		});
		window.addEventListener('beforeunload', function() {
			try {
				var state = EJS_emulator.gameManager.getState();
				if (state && state.byteLength > 0) {
					var bytes = new Uint8Array(state);
					var binary = '';
					for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
					window.parent.postMessage({ type: 'save-data', gameId: 'clpokepath', data: btoa(binary) }, '*');
				}
			} catch(e) {}
		});
	</script>
</body>
</html>
