<!DOCTYPE html>
<!--
  PS2 game template — duplicate this file, set GAME_ROM_URL + GAME_TITLE,
  and add a matching entry to games/games.json with rom:'ps2'.

  Unlike other game HTMLs on the site, PS2 games don't use EmulatorJS —
  they use the self-hosted Play! PS2 emulator at /play/index.html, which
  runs cross-origin-isolated (COOP/COEP) for SharedArrayBuffer access.
  We iframe it and pass the ROM URL as a query string; /play/index.html's
  loader shim fetches the ROM and feeds it to Play!'s file picker.

  ROM URL pattern (same as all other games):
    https://arcad-groq.gatabanumai.workers.dev/rom?src=<url-encoded-archive.org-url>
-->
<html>
<head>
<meta charset="UTF-8">
<title>__GAME_TITLE__</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0a0f; }
  iframe { display:block; width:100%; height:100vh; border:0; }
</style>
</head>
<body>
<iframe
    src="/play/index.html?name=__GAME_TITLE_ENCODED__&rom=__GAME_ROM_URL_ENCODED__"
    allow="cross-origin-isolated; autoplay; gamepad *; fullscreen"
></iframe>
</body>
</html>
