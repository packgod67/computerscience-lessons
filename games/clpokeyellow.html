<!DOCTYPE html>


<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


  <head>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading game...</div>
    </div>
    <script>
      document.getElementById("loading-progress").textContent = "Loading Pokemon Yellow...";

      EJS_player = "#game";
      EJS_core = "gba";
      EJS_gameName = "Pokemon Yellow";
      EJS_color = "#0064ff";
      EJS_startOnLoaded = true;
      if (typeof EJS_VirtualGamepadEnabled === 'undefined') EJS_VirtualGamepadEnabled = true;
      EJS_defaultControls = true;
      EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
      EJS_gameUrl = "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@cf2db6e9366385521ac2ce4e87b8d364aac61a37/Pokemon%20-%20Yellow%20Version%20-%20Special%20Pikachu%20Edition%20(USA%2C%20Europe)%20(CGB%2BSGB%20Enhanced).zip";

      EJS_onGameStart = function() {
        document.getElementById("loading-progress")?.remove();
        window.parent.postMessage({ type: 'emu-ready', gameId: 'clpokeyellow' }, '*');

        setInterval(function() {
          try {
            var state = EJS_emulator.gameManager.getState();
            if (state && state.byteLength > 0) {
              var bytes = new Uint8Array(state);
              var binary = '';
              for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
              window.parent.postMessage({ type: 'save-data', gameId: 'clpokeyellow', data: btoa(binary) }, '*');
            }
          } catch(e) { console.error('Auto-save error:', e); }
        }, 60000);
      };

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'load-save' && e.data.data) {
          try {
            var binary = atob(e.data.data);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            EJS_emulator.gameManager.loadState(bytes.buffer);
          } catch(e) { console.error('Cloud load error:', e); }
        }
      });

      window.addEventListener('beforeunload', function() {
        try {
          var state = EJS_emulator.gameManager.getState();
          if (state && state.byteLength > 0) {
            var bytes = new Uint8Array(state);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            window.parent.postMessage({ type: 'save-data', gameId: 'clpokeyellow', data: btoa(binary) }, '*');
          }
        } catch(e) {}
      });

      var script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
      document.body.appendChild(script);
    </script>
  </body>
</html>
