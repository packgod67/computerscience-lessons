<body>
	<div style="width: 100vw; height: 100vh;max-width:100%">
		<div id="game" style="display: none;"></div>
		<button id="startButton">PLAY</button>
	</div>
	<script>
		document.getElementById("game").style.display = "none";
            function startGame() {
                document.getElementById("game").style.display = "block";
                document.getElementById("startButton").style.display = "none";
                EJS_player = "#game";
                EJS_core = "gba";
                EJS_color = "#000000";
                EJS_startOnLoaded = true;
                EJS_cacheLimit = 0;
                EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
                EJS_netplayServer = "https://netplay.emulatorjs.org";
                EJS_gameUrl = "https://cdn.jsdelivr.net/gh/schoolstuff1337/supplies@main/gb/Too%20Many%20Types%202%20(v1.4.0).7z";
                loadGame();
            }
            document.getElementById("startButton").addEventListener("click", startGame);
            function loadGame() {
                var script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
                document.body.appendChild(script);
            }
	</script>
	<script>
		// Cloud save (robust - polls for emulator)
		(function() {
			var GAME_ID = 'clpoketoomanytypes2';
			var saveStarted = false;

			function saveToCloud() {
				try {
					var state = EJS_emulator.gameManager.getState();
					if (state && state.byteLength > 0) {
						var bytes = new Uint8Array(state);
						var binary = '';
						for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
						window.parent.postMessage({ type: 'save-data', gameId: GAME_ID, data: btoa(binary) }, '*');
					}
				} catch(e) {}
			}

			function startCloudSave() {
				if (saveStarted) return;
				saveStarted = true;
				window.parent.postMessage({ type: 'emu-ready', gameId: GAME_ID }, '*');
				setTimeout(saveToCloud, 10000);
				setInterval(saveToCloud, 60000);
			}

			// Method 1: EJS_onGameStart (newer EmulatorJS)
			EJS_onGameStart = function() { startCloudSave(); };

			// Method 2: Poll for emulator (older EmulatorJS fallback)
			var poll = setInterval(function() {
				try {
					if (typeof EJS_emulator !== 'undefined' && EJS_emulator.gameManager) {
						clearInterval(poll);
						startCloudSave();
					}
				} catch(e) {}
			}, 2000);
			setTimeout(function() { clearInterval(poll); }, 300000);

			// Load save from parent
			window.addEventListener('message', function(e) {
				if (e.data && e.data.type === 'load-save' && e.data.data) {
					try {
						var binary = atob(e.data.data);
						var bytes = new Uint8Array(binary.length);
						for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
						EJS_emulator.gameManager.loadState(bytes.buffer);
					} catch(e) {}
				}
			});

			// Save on tab close
			window.addEventListener('beforeunload', function() { saveToCloud(); });
		})();
	</script>
