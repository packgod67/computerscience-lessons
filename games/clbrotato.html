<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Brotato</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0a0a0f; }
  iframe { display:block; width:100%; height:100vh; border:0; }
</style>
</head>
<body>
<!-- miniplay.com/embed/brotato is iframable (no X-Frame-Options, no
     restrictive CSP). The official Brotato has no first-party browser
     build; this is a community port hosted on miniplay's CDN. -->
<iframe src="https://www.miniplay.com/embed/brotato"
        allow="autoplay; gamepad *; fullscreen"
        allowfullscreen></iframe>
</body>
</html>
