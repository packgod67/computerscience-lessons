<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#bg)" rx="8"/>
  <rect width="320" height="120" fill="url(#shine)" rx="8"/>
  <!-- Pokeball line -->
  <line x1="0" y1="120" x2="110" y2="120" stroke="#fce7f3" stroke-width="3" opacity="0.4"/>
  <line x1="210" y1="120" x2="320" y2="120" stroke="#fce7f3" stroke-width="3" opacity="0.4"/>
  <circle cx="160" cy="120" r="28" fill="none" stroke="#fce7f3" stroke-width="3" opacity="0.3"/>
  <circle cx="160" cy="120" r="10" fill="#fce7f3" opacity="0.4"/>
  <!-- Category badge -->
  <rect x="10" y="10" width="90" height="24" rx="12" fill="#fce7f3" opacity="0.8"/>
  <text x="55" y="27" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ec4899" letter-spacing="1">POKEMON</text>
  <!-- Title -->
  <text x="160" y="183" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" letter-spacing="0.5">Ultimate Fusion</text>
</svg>