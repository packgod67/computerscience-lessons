<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing... - Arcade</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="icon" href="assets/logo.png">
    <!-- Cross-origin isolation bootstrap. The arcade SW (sw.js) injects
         COOP same-origin + COEP require-corp into every play.html and
         /games/*.html response so the page is cross-origin-isolated —
         required for Godot 4 / Unity / any engine using SharedArrayBuffer.
         But on FIRST visit, the SW isn't yet controlling the page, so the
         initial document loads WITHOUT those headers. We need to:
           1. Register the SW.
           2. Wait until it's controlling.
           3. Reload — the second load goes through the SW and is COI.
         If we let the iframe (gameFrame) start loading the game before
         the reload fires, the in-progress load gets killed by the reload
         and Chrome shows a sad-face blocked frame. So we hide the page
         during the SW dance, and only the second load (with COI) is ever
         shown to the user.
         The sessionStorage guard prevents an infinite reload loop. -->
    <script>
    (function () {
        if (window.crossOriginIsolated) return;
        if (!('serviceWorker' in navigator)) return;
        if (sessionStorage.getItem('arcade-coi-reloaded') === '1') return;
        // Hide everything until COI is confirmed on the next load. This
        // also keeps the iframe from racing the reload — without
        // visibility:hidden, the gameFrame would start loading the game,
        // get half-rendered, then get killed when location.reload() fires.
        var hideStyle = document.createElement('style');
        hideStyle.textContent = 'html { visibility: hidden !important; }';
        document.documentElement.appendChild(hideStyle);
        function reloadOnce() {
            sessionStorage.setItem('arcade-coi-reloaded', '1');
            location.reload();
        }
        navigator.serviceWorker.register('sw.js').then(function () {
            // If a SW is already controlling, reload immediately — page
            // just didn't go through it. (Browser launch / fresh tab.)
            if (navigator.serviceWorker.controller) {
                reloadOnce();
                return;
            }
            // Otherwise listen for the new SW to take control.
            navigator.serviceWorker.addEventListener('controllerchange', reloadOnce, { once: true });
        }).catch(function () {
            // SW registration failed — give up and show the page anyway.
            // The game will fail with the Godot COI error but at least
            // the rest of the player UI is visible.
            hideStyle.remove();
        });
    })();
    </script>
    <!-- Google Fonts for user-selected font families (must match index.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@400;600&family=Cinzel:wght@400;600&family=Comic+Neue:wght@400;700&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="player-body">
    <div class="player-header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            Back to Arcade
        </a>
        <div class="player-info">
            <h1 id="gameTitle">Loading...</h1>
            <span class="player-category" id="gameCategory"></span>
        </div>
        <div class="player-actions">
            <button class="fullscreen-btn fav-btn-player" id="favBtn" title="Favorite">&#9733;</button>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
            <div class="auth-area" id="authArea"></div>
        </div>
    </div>

    <div class="player-container" id="playerContainer">
        <!-- allow=cross-origin-isolated lets PS2 games (which nest into
             /play/ with its own COOP/COEP) actually get cross-origin
             isolation. Without this the inner iframe falls back to
             non-isolated mode and SharedArrayBuffer can't transfer to
             workers. autoplay/gamepad/fullscreen enable controller input
             and fullscreen toggles on every game. -->
        <iframe id="gameFrame" class="game-frame"
                allow="cross-origin-isolated; autoplay; gamepad *; fullscreen"
                allowfullscreen></iframe>
        <div class="game-loading" id="gameLoading">
            <div class="loader"></div>
            <p id="loadingText">Loading game...</p>
        </div>
        <div class="game-error" id="gameError" style="display:none;">
            <p>This game failed to load or crashed.</p>
            <p class="error-detail" id="errorDetail"></p>
            <div class="error-actions">
                <button onclick="document.getElementById('gameFrame').src=document.getElementById('gameFrame').src" class="retry-btn">Retry</button>
                <a href="index.html" class="retry-btn secondary">Back to Arcade</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/telemetry.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customgames.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/profile-widgets.js"></script>
    <script src="js/cheats.js"></script>
    <script src="js/recommender.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
