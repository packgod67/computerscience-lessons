<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing... - Arcade</title>
    <meta name="theme-color" content="#7c3aed">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="icon" href="assets/logo.png">
    <!-- Cross-origin isolation bootstrap: the arcade's main service worker
         (sw.js) injects COOP same-origin + COEP credentialless headers
         into every navigation response on this origin. But on FIRST visit
         the SW isn't yet controlling the page, so the initial document
         load lacks the headers. If COI isn't active by the time the SW
         takes over, force a one-time reload — second load comes through
         the SW and IS cross-origin-isolated. The sessionStorage guard
         prevents an infinite reload loop on browsers that don't support
         service workers. -->
    <script>
    (function () {
        if (window.crossOriginIsolated) return;
        if (!('serviceWorker' in navigator)) return;
        if (sessionStorage.getItem('arcade-coi-reloaded') === '1') return;
        navigator.serviceWorker.register('sw.js').then(function () {
            return navigator.serviceWorker.ready;
        }).then(function () {
            // Wait one tick for the SW to actually start controlling
            // the page, then reload if we're still not isolated.
            setTimeout(function () {
                if (!window.crossOriginIsolated && navigator.serviceWorker.controller) {
                    sessionStorage.setItem('arcade-coi-reloaded', '1');
                    location.reload();
                }
            }, 100);
        }).catch(function () { /* ignore */ });
    })();
    </script>
    <!-- Google Fonts for user-selected font families (must match index.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@400;600&family=Cinzel:wght@400;600&family=Comic+Neue:wght@400;700&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="player-body">
    <div class="player-header">
        <a href="index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            Back to Arcade
        </a>
        <div class="player-info">
            <h1 id="gameTitle">Loading...</h1>
            <span class="player-category" id="gameCategory"></span>
        </div>
        <div class="player-actions">
            <button class="fullscreen-btn fav-btn-player" id="favBtn" title="Favorite">&#9733;</button>
            <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
            <div class="auth-area" id="authArea"></div>
        </div>
    </div>

    <div class="player-container" id="playerContainer">
        <!-- allow=cross-origin-isolated lets PS2 games (which nest into
             /play/ with its own COOP/COEP) actually get cross-origin
             isolation. Without this the inner iframe falls back to
             non-isolated mode and SharedArrayBuffer can't transfer to
             workers. autoplay/gamepad/fullscreen enable controller input
             and fullscreen toggles on every game. -->
        <iframe id="gameFrame" class="game-frame"
                allow="cross-origin-isolated; autoplay; gamepad *; fullscreen"
                allowfullscreen></iframe>
        <div class="game-loading" id="gameLoading">
            <div class="loader"></div>
            <p id="loadingText">Loading game...</p>
        </div>
        <div class="game-error" id="gameError" style="display:none;">
            <p>This game failed to load or crashed.</p>
            <p class="error-detail" id="errorDetail"></p>
            <div class="error-actions">
                <button onclick="document.getElementById('gameFrame').src=document.getElementById('gameFrame').src" class="retry-btn">Retry</button>
                <a href="index.html" class="retry-btn secondary">Back to Arcade</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/profile-widgets.js"></script>
    <script src="js/cheats.js"></script>
    <script src="js/recommender.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
