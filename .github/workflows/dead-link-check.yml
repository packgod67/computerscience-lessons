# Nightly dead-link check across the iframe-pattern games. Runs the
# existing `audit-itch.mjs` script which probes every itch HTML5 game
# wrapper and flags:
#   - Hotlink-protected games (htmlgame.js present in response)
#   - Dead URLs (HTTP 4xx/5xx)
#   - Network errors
#
# When anything's broken, the workflow opens (or updates) a single
# tracking issue tagged `dead-link` so we don't spam new issues every
# night. Closes the issue automatically when the next run is clean.
#
# Manual trigger via "Run workflow" button is also available for
# on-demand checks after big batches of new games.

name: Dead-link audit

on:
  schedule:
    # Nightly at 04:30 UTC (~late-night for most timezones, low traffic).
    # Cron is GitHub Actions UTC.
    - cron: '30 4 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: read
  issues: write       # needed to open/close the tracking issue

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit-itch.mjs
        id: audit
        run: |
          # Capture the audit output, also save to a file for the issue body.
          # Audit script writes plain text (HOTLINK, DEAD, ERROR sections).
          set +e
          node audit-itch.mjs 2>&1 | tee audit-output.txt
          # Parse counts from the summary line. Format:
          #   Total: N | broken: M
          BROKEN=$(grep -oE 'broken: [0-9]+' audit-output.txt | grep -oE '[0-9]+' | head -1)
          BROKEN=${BROKEN:-0}
          echo "broken_count=$BROKEN" >> "$GITHUB_OUTPUT"
          echo "Audit found $BROKEN broken games"

      - name: Open or update tracking issue
        if: steps.audit.outputs.broken_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const broken = '${{ steps.audit.outputs.broken_count }}';
            const title = `[dead-link audit] ${broken} broken game(s) detected`;
            const body = [
              `## Audit summary`,
              ``,
              `Run on \`${new Date().toISOString()}\` for commit \`${context.sha.slice(0,7)}\`.`,
              ``,
              `**${broken}** game wrapper(s) are pointing at dead or hotlink-protected URLs.`,
              ``,
              `## Full output`,
              ``,
              '```',
              output.slice(0, 60000),  // GH issue body max ~65K
              '```',
              ``,
              `## Fixing`,
              `- For dead URLs (HTTP 4xx/5xx): the dev removed the build. Either find an alternate embed URL or remove the entry from \`games/games.json\` + delete the wrapper.`,
              `- For hotlink-protected (htmlgame.js): run \`node migrate-itch-proxy.mjs --apply\` locally to route those games through the worker proxy, then commit + push.`,
              ``,
              `*This issue is auto-managed by \`.github/workflows/dead-link-check.yml\`. It closes when the next clean audit runs.*`,
            ].join('\n');

            // Find existing open audit issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-link',
              per_page: 5,
            });
            const existing = issues.data.find(i => i.title.startsWith('[dead-link audit]'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['dead-link', 'automated'],
              });
              console.log('Opened new issue');
            }

      - name: Close tracking issue when clean
        if: steps.audit.outputs.broken_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dead-link',
              per_page: 5,
            });
            for (const issue of issues.data) {
              if (!issue.title.startsWith('[dead-link audit]')) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Latest audit at commit \`${context.sha.slice(0,7)}\` reports 0 broken games. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed issue #${issue.number}`);
            }
