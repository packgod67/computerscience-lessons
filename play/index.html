<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Play! — PS2 Emulator</title>
<!-- COOP/COEP at the HTTP header level (set via _headers / render.yaml).
     Meta-tag fallback in case the hosting layer doesn't pass through headers. -->
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
<link rel="icon" href="/favicon.ico"/>
<link href="static/css/main.5a525eca.css" rel="stylesheet">
<!--
  Service-worker-based COOP/COEP injector. Render's static hosting doesn't
  honor our `_headers` file and we don't want to hardcode dashboard state
  in the repo, so we synthesize cross-origin isolation client-side instead.
  On first visit the SW registers and the page reloads; the second load
  is cross-origin-isolated, SharedArrayBuffer becomes transferable, and
  Play! initializes. MIT-licensed, well-maintained.
-->
<script>
    // Diagnostic — surfaces the isolation state at page load so we can tell
    // from the console whether the SW is doing its job.
    console.log('[arcade-play] crossOriginIsolated =', window.crossOriginIsolated);
    console.log('[arcade-play] isSecureContext =', window.isSecureContext);
    console.log('[arcade-play] SharedArrayBuffer =', typeof SharedArrayBuffer);
    console.log('[arcade-play] SW controller =', navigator.serviceWorker?.controller ? 'yes' : 'no');

    // ─── Perf: suppress Play!'s WebGL error spam ──────────────────────
    // Play!'s GS-on-WebGL backend issues calls that some games (NFS
    // Carbon being a known offender) don't strictly conform to. Each
    // INVALID_OPERATION / INVALID_ENUM costs Chrome ~1ms in DevTools
    // bookkeeping. Hundreds per second adds up to a real FPS hit.
    //
    // We can't stop Play! from making the calls, but we CAN silence
    // the logger so Chrome doesn't pay the formatting/storage cost.
    // Drop only WebGL-prefixed messages; everything else (including
    // Play!'s actual init/error output) passes through.
    (function suppressWebglSpam() {
        let suppressed = 0;
        const origError = console.error;
        const origWarn = console.warn;
        const drop = (orig) => function (...args) {
            const first = args[0];
            if (typeof first === 'string' && (
                first.startsWith('WebGL:') ||
                first.startsWith('[.WebGL') ||
                /INVALID_(OPERATION|ENUM|VALUE)/.test(first) ||
                /texParameter/.test(first)
            )) {
                suppressed++;
                return;
            }
            orig.apply(console, args);
        };
        console.error = drop(origError);
        console.warn = drop(origWarn);
        // Surface the suppression count once per minute so we don't
        // lose visibility entirely — if something genuinely new is
        // breaking, you'll see the count spike.
        setInterval(() => {
            if (suppressed > 0) {
                console.log('[arcade-play] suppressed', suppressed, 'WebGL error logs this minute');
                suppressed = 0;
            }
        }, 60_000);

        // Also no-op the gl.getError polling result so Play! doesn't
        // re-poll on every frame. We intercept at the canvas-context
        // level once a WebGL context is created. Most of the perf
        // hit comes from the logger above; this is belt-and-suspenders.
        const origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, ...rest) {
            const ctx = origGetContext.call(this, type, ...rest);
            if (ctx && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
                // Wrap getError so Play! sees NO_ERROR instead of polling
                // a queued error stream. This is safe: errors raised in
                // WebGL don't affect program correctness, only diagnostics.
                ctx.getError = () => ctx.NO_ERROR;
            }
            return ctx;
        };
    })();
</script>
<script src="coi-serviceworker.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; color:#e5e5e5; font-family:Arial,sans-serif; }

  /* Override Play!'s built-in layout. The stock HTML puts the canvas
     above the file picker and has an absolute-positioned version string
     at the bottom. We use CSS order to flip that so the picker is the
     first thing visible, canvas below, so the user sees the upload UI
     without scrolling. */
  .global-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    min-height: 100vh;
    gap: 16px;
  }
  .global-column {
    flex: 0 1 auto;
    margin: 0;
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .global-column + .global-column { display: none; }   /* hide stock info column */

  /* Re-order children of .global-column: file picker first, intro second,
     canvas last. Canvas's parent <div> is what the DOM has — target that. */
  .global-column > div:has(canvas) { order: 3; }
  #root { order: 1; }
  #arcade-intro { order: 2; }

  canvas {
    aspect-ratio: 4 / 3;
    width: 100%;
    max-height: 60vh;
    background: #000;
    border-radius: 8px;
    outline: none;
  }

  /* Style the file picker div. When no ?rom= is set the user is doing
     a DIY upload — this is what they'll see. */
  #root {
    text-align: center;
  }
  #root input[type="file"] {
    display: inline-block;
    padding: 14px 24px;
    background: linear-gradient(135deg, #7c3aed, #dc2626);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #root input[type="file"]::file-selector-button {
    padding: 8px 16px;
    margin-right: 12px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  #root input[type="file"]::file-selector-button:hover {
    background: rgba(255,255,255,0.25);
  }

  .stats {
    display: inline-block;
    margin-left: 20px;
    padding: 4px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    font-family: monospace;
    color: #a0a0a0;
  }
  /* Stock version string is position:absolute bottom:0 left:0. CSS
     specificity: span.version beats .version, so target the element. */
  span.version { display: none !important; }

  #arcade-intro {
    text-align: center;
    color: #a0a0a0;
    font-size: 0.88rem;
    margin-top: 12px;
  }
  #arcade-intro strong { color: #e5e5e5; }

  /* ROM download UI — shown while the ?rom= fetch is in progress. Solid
     panel at the top of the viewport with a visible percentage, download
     rate, and filling progress bar so users don't stare at a static
     "Downloading…" string for minutes on 2-5 GB PS2 ROMs. */
  #arcade-rom-banner {
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    min-width: 380px;
    max-width: calc(100vw - 40px);
    background: rgba(10, 10, 15, 0.96);
    color: #fff;
    padding: 12px 18px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    font-size: 0.88rem;
    z-index: 9999;
    display: none;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
  }
  #arcade-rom-banner.visible { display: block; }

  /* Persistent 'back to arcade' link so users who break out of play.html
     into /play/ (PS2 games) have a way back. Subtle top-left chip. */
  #arcade-back-link {
    position: fixed;
    top: 12px; left: 14px;
    padding: 6px 12px;
    background: rgba(10, 10, 15, 0.85);
    color: #d4d4d8;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    font-size: 0.8rem;
    z-index: 9998;
    transition: background 0.15s, color 0.15s;
  }
  #arcade-back-link:hover { background: rgba(20, 20, 30, 1); color: #fff; }
  #arcade-rom-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  #arcade-rom-title {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #arcade-rom-pct {
    font-variant-numeric: tabular-nums;
    color: #a5b4fc;
    flex-shrink: 0;
  }
  #arcade-rom-bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #arcade-rom-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #dc2626);
    width: 0%;
    transition: width 0.15s ease-out;
  }
  #arcade-rom-details {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.72rem;
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
  }
  #arcade-rom-speed-line {
    display: inline-flex;
    gap: 10px;
  }
  #arcade-rom-eta::before {
    content: '~';
    opacity: 0.5;
    margin-right: 2px;
  }
  /* Hide the stock intro text once a ROM download is active — redundant
     with the banner and looks cluttered behind it. */
  body.arcade-rom-loading #arcade-intro { display: none; }
</style>

<body>
<a id="arcade-back-link" href="/">&larr; Back to arcade</a>
<div id="arcade-rom-banner">
    <div id="arcade-rom-label">
        <span id="arcade-rom-title">Preparing…</span>
        <span id="arcade-rom-pct"></span>
    </div>
    <div id="arcade-rom-bar"><div id="arcade-rom-bar-fill"></div></div>
    <div id="arcade-rom-details">
        <span id="arcade-rom-bytes"></span>
        <span id="arcade-rom-speed-line">
            <span id="arcade-rom-speed"></span>
            <span id="arcade-rom-eta"></span>
        </span>
    </div>
</div>
<div class="global-row">
  <div class="global-column">
    <div><canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas></div>
    <div id="root"></div>
    <div id="arcade-intro">
      <strong>Play! PS2 Emulator.</strong> Pick a .iso/.chd/.bin/.elf to boot.
      Supported: ISO, CSO, CHD, ISZ, BIN, ELF. No BIOS needed.
      <br>
      <span style="opacity:.7;">Experimental — compatibility varies per game.</span>
    </div>
  </div>
  <div class="global-column"><!-- hidden by CSS, kept so React's layout doesn't break --></div>
</div>

<!--
  ROM URL auto-loader — bridges the ?rom=<url> query param into Play!'s
  file input. The hosted build has no URL API, so we fetch the ROM
  ourselves, wrap it in a File, shove it into the <input type="file">
  via DataTransfer, and dispatch a 'change' event. React's handler runs
  exactly as if the user had picked the file.
-->
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const romUrl = params.get('rom');
    const gameName = params.get('name') || '';
    if (!romUrl) return;

    // ─── UI helpers ────────────────────────────────────────────────────
    const banner = document.getElementById('arcade-rom-banner');
    const titleEl = document.getElementById('arcade-rom-title');
    const pctEl = document.getElementById('arcade-rom-pct');
    const fillEl = document.getElementById('arcade-rom-bar-fill');
    const bytesEl = document.getElementById('arcade-rom-bytes');
    const speedEl = document.getElementById('arcade-rom-speed');
    const etaEl = document.getElementById('arcade-rom-eta');

    function show() {
        banner.classList.add('visible');
        document.body.classList.add('arcade-rom-loading');
    }
    function hide() {
        banner.classList.remove('visible');
        document.body.classList.remove('arcade-rom-loading');
    }
    function setTitle(s) { if (titleEl) titleEl.textContent = s; }
    function setPct(pct) {
        if (!pctEl || !fillEl) return;
        if (pct == null) { pctEl.textContent = ''; fillEl.style.width = '0%'; return; }
        const c = Math.max(0, Math.min(100, pct));
        pctEl.textContent = c.toFixed(0) + '%';
        fillEl.style.width = c + '%';
    }
    function setBytes(received, total) {
        if (!bytesEl) return;
        const mb = (n) => (n / 1048576).toFixed(1) + ' MB';
        bytesEl.textContent = total ? `${mb(received)} / ${mb(total)}` : mb(received);
    }
    function setSpeed(bps) {
        if (!speedEl) return;
        if (!bps || !isFinite(bps)) { speedEl.textContent = ''; return; }
        const mbps = bps / 1048576;
        speedEl.textContent = mbps >= 1 ? mbps.toFixed(1) + ' MB/s' : (bps / 1024).toFixed(0) + ' KB/s';
    }
    // ETA = (bytes remaining) / (current speed). Shows as m:ss for short
    // waits, h:mm:ss once over an hour. Blanks out at <3 seconds to avoid
    // a jumpy countdown ending. Called every progress tick.
    function setEta(remainingBytes, bps) {
        if (!etaEl) return;
        if (!bps || bps < 1024 || !isFinite(bps) || remainingBytes <= 0) {
            etaEl.textContent = '';
            return;
        }
        const secs = Math.round(remainingBytes / bps);
        if (secs < 3) { etaEl.textContent = ''; return; }
        const pad = (n) => String(n).padStart(2, '0');
        let txt;
        if (secs >= 3600) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            txt = `${h}:${pad(m)}:${pad(s)}`;
        } else {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            txt = `${m}:${pad(s)}`;
        }
        etaEl.textContent = txt + ' left';
    }

    setTitle(`Preparing ${gameName || 'ROM'}…`);
    setPct(null);
    setBytes(0, 0);
    setSpeed(0);
    show();

    function filenameFromUrl(u) {
        try {
            const url = new URL(u);
            // Worker-proxy URLs (arcad-groq.../rom?src=...) have a
            // pathname of just '/rom', which would yield 'rom' as the
            // filename — Play! rejects files without an extension. Peek
            // at the embedded `src=` to get the real archive.org URL
            // and pull the filename from THERE.
            let target = url;
            const src = url.searchParams.get('src');
            if (src) {
                try { target = new URL(src); } catch {}
            }
            const base = target.pathname.split('/').pop() || 'game.iso';
            const name = decodeURIComponent(base.split('?')[0]);
            // Final safety net: if we still don't have an extension,
            // append .iso (PS2's most common format, what Play! expects
            // by default) so the emulator doesn't bail on the filename
            // check.
            return /\.[a-z0-9]{1,5}$/i.test(name) ? name : name + '.iso';
        } catch { return 'game.iso'; }
    }
    const filename = filenameFromUrl(romUrl);

    // ─── IndexedDB cache ───────────────────────────────────────────────
    // Persistent store for downloaded ROMs so a second play is instant.
    // Keyed by ROM URL; value is the Blob. Browsers handle the backing
    // storage (disk-backed for large blobs) and enforce per-origin quotas.
    const DB_NAME = 'arcade-play-roms';
    const STORE = 'roms';

    function openDb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains(STORE)) {
                    req.result.createObjectStore(STORE);
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function cacheGet(key) {
        try {
            const db = await openDb();
            // Single-blob entry?
            const single = await new Promise((resolve) => {
                const tx = db.transaction(STORE, 'readonly');
                const req = tx.objectStore(STORE).get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
            if (single) return single;
            // Manifest (either chunked-IDB or OPFS marker)?
            const meta = await new Promise((resolve) => {
                const tx = db.transaction(STORE, 'readonly');
                const req = tx.objectStore(STORE).get(key + '#meta');
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
            if (!meta) return null;

            // OPFS path — Origin Private File System holds the actual
            // bytes; meta is just a pointer (filename + size + type).
            if (meta.opfs && navigator.storage?.getDirectory) {
                try {
                    const root = await navigator.storage.getDirectory();
                    const handle = await root.getFileHandle(meta.name, { create: false });
                    const file = await handle.getFile();
                    if (file.size > 0) return file;
                } catch (e) {
                    console.warn('[arcade-play] OPFS read failed for', key, e);
                    return null;
                }
            }

            // Chunked-IDB path — see ps2-preload.js cachePut.
            if (meta.chunked) {
                const parts = [];
                for (let i = 0; i < meta.chunkCount; i++) {
                    const chunk = await new Promise((resolve) => {
                        const tx = db.transaction(STORE, 'readonly');
                        const req = tx.objectStore(STORE).get(key + '#' + i);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                    if (!chunk) {
                        console.warn('[arcade-play] missing chunk', i, 'for', key);
                        return null;
                    }
                    parts.push(chunk);
                }
                return new Blob(parts, { type: meta.type || 'application/octet-stream' });
            }

            return null;
        } catch { return null; }
    }
    async function cachePut(key, blob) {
        try {
            const db = await openDb();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).put(blob, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
            return true;
        } catch (e) {
            console.warn('[arcade-play] cache write failed:', e);
            return false;
        }
    }

    // ─── Parallel Range downloader ─────────────────────────────────────
    // Archive.org throttles each connection but may also throttle per-IP
    // — 4 parallel connections can actually be slower than 2 if they
    // trip the IP-based limit. Start at 2 as a safer default; if a user
    // has fast archive.org access they'll still get a 2x improvement,
    // and if archive.org is rate-limiting aggressively we avoid piling
    // on extra connections that each get throttled to a smaller share.
    const PARALLEL = 2;

    async function fetchInParallel(url) {
        // Probe total size + range support with a tiny Range request
        // instead of HEAD. A 2-byte range returns 206 Partial Content
        // with Content-Range: bytes 0-1/TOTAL, telling us the size AND
        // confirming range support in one round trip. If the server
        // ignores Range and returns 200, we know parallel won't work.
        const probeStart = performance.now();
        let probe;
        try {
            probe = await fetch(url, { mode: 'cors', headers: { Range: 'bytes=0-1' } });
        } catch (e) {
            throw new Error('probe failed: ' + e.message);
        }
        const probeMs = Math.round(performance.now() - probeStart);
        console.log('[arcade-play] range probe:', probe.status, 'in', probeMs, 'ms');

        if (probe.status !== 206) {
            // Server ignored Range — cancel the stream so we don't
            // waste bandwidth, then fall back to single.
            probe.body?.cancel().catch(() => {});
            throw new Error('range not supported (HTTP ' + probe.status + ')');
        }
        // Content-Range: bytes 0-1/12345678 → total from after the slash
        const cr = probe.headers.get('content-range') || '';
        const totalMatch = cr.match(/\/(\d+)$/);
        const total = totalMatch ? parseInt(totalMatch[1], 10) : 0;
        probe.body?.cancel().catch(() => {});  // drop the 2 bytes; we only needed the header

        if (!total || PARALLEL <= 1) {
            return fetchSingle(url, total);
        }
        console.log('[arcade-play] parallel download:', PARALLEL, 'connections, total =', (total / 1048576).toFixed(1), 'MB');

        const chunkSize = Math.ceil(total / PARALLEL);
        const ranges = [];
        for (let i = 0; i < PARALLEL; i++) {
            const start = i * chunkSize;
            const end = Math.min(start + chunkSize - 1, total - 1);
            if (start <= end) ranges.push({ start, end, index: i });
        }

        let received = 0;
        const buffers = new Array(ranges.length);

        // Speed samples shared across all workers so the headline rate is
        // the true aggregate throughput.
        const WINDOW_MS = 2000;
        const samples = [{ t: performance.now(), bytes: 0 }];

        function tickProgress() {
            const now = performance.now();
            samples.push({ t: now, bytes: received });
            while (samples.length > 1 && (now - samples[0].t) > WINDOW_MS) samples.shift();
            const w0 = samples[0];
            const dt = (now - w0.t) / 1000;
            const db = received - w0.bytes;
            const speed = dt > 0.1 ? db / dt : 0;
            setBytes(received, total);
            setPct((received / total) * 100);
            setSpeed(speed);
            setEta(total - received, speed);
        }

        await Promise.all(ranges.map(async ({ start, end, index }) => {
            const resp = await fetch(url, {
                mode: 'cors',
                headers: { Range: `bytes=${start}-${end}` },
            });
            if (!resp.ok && resp.status !== 206) {
                // If one worker gets 200 back, the server silently
                // ignored Range — abort this strategy and throw so we
                // fall back to single-connection.
                throw new Error('Range not honored (HTTP ' + resp.status + ')');
            }
            const reader = resp.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                tickProgress();
            }
            buffers[index] = new Blob(chunks);
        }));

        return new Blob(buffers);
    }

    async function fetchSingle(url, knownTotal) {
        const resp = await fetch(url, { mode: 'cors' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const total = knownTotal || parseInt(resp.headers.get('content-length') || '0', 10);
        const reader = resp.body.getReader();
        const chunks = [];
        let received = 0;
        const WINDOW_MS = 2000;
        const samples = [{ t: performance.now(), bytes: 0 }];
        const t0 = performance.now();
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            const now = performance.now();
            samples.push({ t: now, bytes: received });
            while (samples.length > 1 && (now - samples[0].t) > WINDOW_MS) samples.shift();
            const w0 = samples[0];
            const dt = (now - w0.t) / 1000;
            const db = received - w0.bytes;
            const speed = dt > 0.1 ? db / dt : 0;
            setSpeed(speed);
            setBytes(received, total);
            if (total) {
                setPct((received / total) * 100);
                setEta(total - received, speed);
            } else {
                const cycle = ((now - t0) / 1500) % 1;
                setPct(cycle * 100);
                pctEl.textContent = (received / 1048576).toFixed(1) + ' MB';
                setEta(0, 0);  // no ETA without a known total
            }
        }
        return new Blob(chunks);
    }

    // ─── Wait for Play!'s file picker then feed it a File ──────────────
    async function feedFileToPlay(blob) {
        const input = await new Promise((resolve) => {
            const tryFind = () => {
                const el = document.querySelector('input[type="file"]');
                if (el) return resolve(el);
                setTimeout(tryFind, 150);
            };
            tryFind();
        });
        const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    // ─── Main flow ─────────────────────────────────────────────────────
    async function run() {
        // 1. Try the IDB cache first — second-play is near-instant.
        setTitle('Checking cache…');
        const cached = await cacheGet(romUrl);
        if (cached && cached.size > 0) {
            console.log('[arcade-play] ROM cache HIT, size =', cached.size);
            setTitle('Loading cached ROM…');
            setPct(100);
            setBytes(cached.size, cached.size);
            setSpeed(0);
            await feedFileToPlay(cached);
            setTitle('Booting…');
            setTimeout(hide, 2000);
            return;
        }

        // 2. Miss — download. Try parallel first, fall back to single
        //    if the server ignores Range.
        setTitle(`Downloading ${gameName || 'ROM'}…`);
        setPct(0);
        let blob;
        try {
            blob = await fetchInParallel(romUrl);
        } catch (e) {
            console.warn('[arcade-play] parallel failed, falling back to single:', e);
            try {
                blob = await fetchSingle(romUrl);
            } catch (e2) {
                setTitle('ROM fetch failed: ' + (e2.message || 'unknown'));
                setPct(null);
                return;
            }
        }

        // 3. Boot FIRST (user plays immediately), cache in background.
        setTitle('Booting…');
        setPct(100);
        setSpeed(0);
        setEta(0, 0);
        await feedFileToPlay(blob);
        setTimeout(hide, 2500);

        // Don't await — let the emulator start while we write to disk.
        cachePut(romUrl, blob).then((ok) => {
            if (ok) console.log('[arcade-play] ROM cached (' + (blob.size / 1048576).toFixed(1) + ' MB)');
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
    } else {
        run();
    }

    // ─── Expose a "clear cached ROMs" helper on window for debugging ───
    // Users can call  arcadePlayClearCache()  from the devtools console
    // to wipe the IDB store if they need the disk back. (A proper UI
    // button for this can come later.)
    window.arcadePlayClearCache = async function () {
        try {
            const db = await openDb();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                tx.objectStore(STORE).clear();
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
            console.log('[arcade-play] ROM cache cleared');
        } catch (e) { console.warn('clear failed', e); }
    };
})();
</script>
