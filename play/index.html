<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Play! — PS2 Emulator</title>
<!-- COOP/COEP at the HTTP header level (set via _headers / render.yaml).
     Meta-tag fallback in case the hosting layer doesn't pass through headers. -->
<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
<link rel="icon" href="/favicon.ico"/>
<link href="static/css/main.5a525eca.css" rel="stylesheet">
<!--
  Service-worker-based COOP/COEP injector. Render's static hosting doesn't
  honor our `_headers` file and we don't want to hardcode dashboard state
  in the repo, so we synthesize cross-origin isolation client-side instead.
  On first visit the SW registers and the page reloads; the second load
  is cross-origin-isolated, SharedArrayBuffer becomes transferable, and
  Play! initializes. MIT-licensed, well-maintained.
-->
<script src="coi-serviceworker.js"></script>
<style>
  body { background:#0a0a0f; color:#e5e5e5; font-family:Arial,sans-serif; }
  #arcade-rom-banner {
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:6px 14px;
    border-radius:20px; font-size:0.85rem; z-index:9999;
    display:none;
  }
  #arcade-rom-banner.visible { display:block; }
</style>
</head>
<body>
<div id="arcade-rom-banner"></div>
<div class="global-row">
  <div class="global-column">
    <div><canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas></div>
    <div id="root"></div>
  </div>
</div>

<!--
  ROM URL auto-loader — bridges the ?rom=<url> query param into Play!'s
  file input. The hosted build has no URL API, so we fetch the ROM
  ourselves, wrap it in a File, shove it into the <input type="file">
  via DataTransfer, and dispatch a 'change' event. React's handler runs
  exactly as if the user had picked the file.
-->
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const romUrl = params.get('rom');
    const gameName = params.get('name') || '';
    if (!romUrl) return;

    const banner = document.getElementById('arcade-rom-banner');
    function status(msg, visible) {
        if (!banner) return;
        banner.textContent = msg;
        banner.classList.toggle('visible', !!visible);
    }
    status(`Downloading ${gameName || 'ROM'}…`, true);

    // Pick a sensible filename — Play! keys off the extension (.iso/.chd/…)
    // to decide disc vs ELF boot mode.
    function filenameFromUrl(u) {
        try {
            const p = new URL(u).pathname;
            const base = p.split('/').pop() || 'game.iso';
            return decodeURIComponent(base.split('?')[0]);
        } catch { return 'game.iso'; }
    }
    const filename = filenameFromUrl(romUrl);

    async function feedRomToPlay() {
        // Wait for React to mount its file input.
        const input = await new Promise((resolve) => {
            const tryFind = () => {
                const el = document.querySelector('input[type="file"]');
                if (el) return resolve(el);
                setTimeout(tryFind, 150);
            };
            tryFind();
        });

        // Stream the ROM. Using fetch keeps memory pressure reasonable
        // (vs. loading the whole thing into a string).
        let resp;
        try {
            resp = await fetch(romUrl, { mode: 'cors' });
        } catch (e) {
            status('ROM fetch failed: ' + e.message, true);
            return;
        }
        if (!resp.ok) {
            status(`ROM fetch failed: HTTP ${resp.status}`, true);
            return;
        }
        const total = parseInt(resp.headers.get('content-length') || '0', 10);
        const reader = resp.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            if (total) {
                const pct = Math.floor((received / total) * 100);
                status(`Downloading ${gameName || 'ROM'}… ${pct}%`, true);
            } else {
                status(`Downloading ${gameName || 'ROM'}… ${(received / 1048576).toFixed(1)} MB`, true);
            }
        }
        const blob = new Blob(chunks);
        status('Booting…', true);

        const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });

        // DataTransfer is the one portable way to synthesize a FileList
        // for an <input type="file">.
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));

        // Hide the banner after a moment — the emulator canvas takes over.
        setTimeout(() => status('', false), 2500);
    }

    // Kick off once the page is interactive — the React app loads via defer.
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', feedRomToPlay);
    } else {
        feedRomToPlay();
    }
})();
</script>

<!-- Play!'s React bundle — relative path so it resolves under /play/ -->
<script defer src="static/js/main.fd7fdcec.js"></script>

</body>
</html>
